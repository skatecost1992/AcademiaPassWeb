# Blueprint de Render: un solo servicio web con la API y la version web (RQ24, RQ27), construido con el Dockerfile
# de la raiz (el mismo que se probo en modo produccion). Guia: docs/DESPLIEGUE_RENDER.md
#
# La base de datos es PostgreSQL de Render (academiapass-db, abajo): Render la crea y entrega su cadena de conexion
# interna en DATABASE_URL, sin copiar claves a mano. Misma base para todos: la web (https://<servicio>.onrender.com)
# y las apps Android/iOS en la opcion "Nube".
# Ojo: la base del plan free vence a los 30 dias de creada; para conservar los datos pasala a un plan pago antes.
#
# Siempre encendido: el plan free se duerme tras 15 minutos sin trafico (y con el, los recordatorios por correo).
# Con plan free, un monitor externo (UptimeRobot) que consulte /api/health cada 5 minutos lo mantiene despierto;
# con plan starter (pago) no se duerme nunca.
services:
  - type: web
    name: academiapass
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: ohio # misma region que la base: la conexion interna solo funciona dentro de la region
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: academiapass-db
          property: connectionString # cadena interna (dentro de la red de Render)
      - key: PGSSL
        value: "off" # la conexion interna de Render no usa SSL
      # RQ67: correos desde tu Gmail por la API de Gmail (HTTPS; Render free bloquea SMTP). Ver docs/CORREO_GMAIL.md
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Alternativa: servicio de correos por API HTTPS (Resend o Brevo)
      - key: RESEND_API_KEY
        sync: false # clave de Resend (re_...); vacia si usas Brevo
      - key: BREVO_API_KEY
        sync: false # clave de Brevo; vacia si usas Resend
      - key: MAIL_FROM
        sync: false # remitente verificado, p. ej. AcademiaPass <avisos@tu-dominio.com>
      - key: ADMIN_SIGNUP_CODE
        sync: false # opcional: si lo defines, solo quien lo conozca puede registrar una organizacion
      - key: ADMIN_INITIAL_PASSWORD
        sync: false # clave del usuario base admin al crearlo; vacia = se genera y se muestra una vez en Logs

databases:
  - name: academiapass-db
    plan: free
    region: ohio
    databaseName: academiapass
    user: academiapass
    ipAllowList: [] # sin acceso desde internet: solo el servicio web de Render se conecta
